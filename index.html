<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>LogParser</title><link rel="stylesheet" href="styles/main.css"/></head>
<body><div id="app">
  <header class="topbar">
    <span class="logo">📋 LogParser</span>
    <div class="controls">
      <button id="btn-sample">Sample</button>
      <button id="btn-clear">Clear</button>
      <select id="filter-level"><option value="ALL">All Levels</option><option>ERROR</option><option>WARN</option><option>INFO</option><option>DEBUG</option><option>FATAL</option></select>
      <input id="filter-search" placeholder="Search…"/>
      <span id="filter-count" class="filter-count"></span>
      <button id="btn-export">Export</button>
    </div>
  </header>
  <div class="stats-bar" id="stats-bar"></div>
  <div class="top-ips-bar">Top IPs: <span id="top-ips"></span></div>
  <div class="workspace">
    <div class="input-pane"><div class="pane-label">Raw Logs</div><textarea id="log-input" placeholder="Paste log output here…"></textarea></div>
    <div class="output-pane"><div class="pane-label">Parsed Entries</div><div id="log-entries" class="log-entries"></div></div>
  </div>
</div>
<script src="src/parser.js"></script><script src="src/app.js"></script></body></html>
